<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>5 Meses com Arthur ❤️</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
color:white;
overflow:hidden;
}

.container{
margin-top:60px;
padding:20px;
}

h1{
font-size:38px;
}

.fotos img{
width:220px;
border-radius:20px;
margin:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

button{
background:white;
color:#ff4d6d;
border:none;
padding:15px 25px;
font-size:18px;
border-radius:30px;
cursor:pointer;
margin:10px;
}

#mensagem{
margin-top:20px;
font-size:20px;
}

.heart{
position:fixed;
top:-10px;
color:red;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container">

<h1>Feliz 5 meses, Arthur ❤️</h1>

<p>Desde 8 de novembro de 2025 estamos juntos há:</p>

<h2 id="contador"></h2>

<div class="fotos">

<img src="foto1.jpg">
<img src="foto2.jpg">
<img src="foto3.jpg">

</div>

<br>

<button onclick="tocarMusica()">Tocar nossa música 🎵</button>

<br>

<button onclick="mostrarMensagem()">Abrir mensagem</button>

<p id="mensagem"></p>

</div>

<audio id="musica" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

function calcularTempo(){

let inicio = new Date("2025-11-08T00:00:00");
let agora = new Date();

let diff = agora - inicio;

let dias = Math.floor(diff / (1000*60*60*24));
let horas = Math.floor((diff / (1000*60*60)) % 24);
let minutos = Math.floor((diff / (1000*60)) % 60);

document.getElementById("contador").innerHTML =
dias + " dias, " + horas + " horas e " + minutos + " minutos ❤️";

}

setInterval(calcularTempo,1000);

function tocarMusica(){
document.getElementById("musica").play();
}

function mostrarMensagem(){

document.getElementById("mensagem").innerHTML =
"Arthur, esses 5 meses ao seu lado foram cheios de momentos incríveis. Obrigada por fazer meus dias mais felizes. Que essa seja só uma pequena parte da nossa história. Eu amo você ❤️";

}

function criarCoracao(){

let heart = document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100+"vw";

heart.style.animationDuration = (Math.random()*3+2)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

}

setInterval(criarCoracao,300);

</script>

</body>
</html>
